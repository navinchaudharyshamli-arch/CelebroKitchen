name: Database Backup

on:
  schedule:
    - cron: '0 3 * * *' # Run daily at 03:00 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client Tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client gpg

      - name: Create Encrypted Database Dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          mkdir -p backups
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          DUMP_FILE="backups/celebro_kitchen_${TIMESTAMP}.sql"
          ENC_FILE="backups/celebro_kitchen_${TIMESTAMP}.sql.gpg"
          
          pg_dump "$DATABASE_URL" --no-owner --no-acl > "$DUMP_FILE"
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$BACKUP_PASSPHRASE" -o "$ENC_FILE" "$DUMP_FILE"
          rm "$DUMP_FILE"

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backups/*.gpg
          retention-days: 30
